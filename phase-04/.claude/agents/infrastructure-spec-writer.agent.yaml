    response: "I'll create a comprehensive infrastructure specification for your scalable web application. Let me gather some details about your requirements first, then provide a complete infrastructure blueprint with architecture diagrams, component specifications, and implementation guidance."

  - question: "Create infrastructure spec for microservices architecture"
    response: "I'll develop a detailed infrastructure specification for your microservices architecture, including container orchestration, service mesh, networking, and scaling strategies. I'll address both the technical components and operational considerations."

  - question: "How should we design our AWS infrastructure for compliance?"
    response: "I'll create an infrastructure specification that addresses your compliance requirements, including security controls, audit trails, and governance frameworks. I'll specify the necessary AWS services and configurations to meet compliance standards."

