# Default values for todo-app

# Global settings
global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""

# Backend (FastAPI) configuration
backend:
  enabled: true
  image:
    registry: ""
    repository: todo-backend
    tag: "latest"
    pullPolicy: IfNotPresent

  replicaCount: 1

  serviceAccount:
    create: true
    annotations: {}
    name: ""

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 2000

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000

  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: chart-example.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: []

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

  nodeSelector: {}
  tolerations: []
  affinity: {}

  # Environment variables for backend
  env:
    DATABASE_URL: "postgresql://user:password@postgres-service:5432/todo_db"
    SECRET_KEY: "your-secret-key-here"
    ALGORITHM: "HS256"
    ACCESS_TOKEN_EXPIRE_MINUTES: "30"
    ADMIN_EMAIL: "admin@taskflow.com"
    ADMIN_PASSWORD: "Admin@12345"
    NEXT_PUBLIC_API_BASE_URL: "http://localhost:8000"

  # Port configuration
  ports:
    - name: http
      containerPort: 8000
      protocol: TCP

# Frontend (Next.js) configuration
frontend:
  enabled: true
  image:
    registry: ""
    repository: todo-frontend
    tag: "latest"
    pullPolicy: IfNotPresent

  replicaCount: 1

  serviceAccount:
    create: true
    annotations: {}
    name: ""

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 2000

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  service:
    type: ClusterIP
    port: 3000
    targetPort: 3000

  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: chart-example.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: []

  resources:
    limits:
      cpu: 300m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi

  nodeSelector: {}
  tolerations: []
  affinity: {}

  # Environment variables for frontend
  env:
    NEXT_PUBLIC_API_BASE_URL: "http://todo-backend-service:8000"

  # Port configuration
  ports:
    - name: http
      containerPort: 3000
      protocol: TCP

# PostgreSQL configuration
postgresql:
  enabled: true
  image:
    registry: docker.io
    repository: postgres
    tag: "15-alpine"

  auth:
    postgresPassword: "postgres-password"
    database: "todo_db"
    username: "todo_user"
    password: "todo-password"

  service:
    ports:
      postgresql: 5432

  persistence:
    enabled: true
    size: 8Gi
    storageClass: ""

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

# Service configurations
service:
  type: ClusterIP
  annotations: {}

# Ingress configuration for entire application
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: todo-app.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Persistence configuration
persistence:
  enabled: false
  size: 8Gi
  storageClass: ""
  accessModes:
    - ReadWriteOnce

# Image pull secrets
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Annotations and labels
commonLabels: {}
commonAnnotations: {}

# Pod configuration
podAnnotations: {}
podLabels: {}

# Priority class
priorityClassName: ""

# Topology spread constraints
topologySpreadConstraints: []

# Init containers
initContainers: []

# Sidecar containers
sidecars: []

# Extra volumes and volume mounts
extraVolumes: []
extraVolumeMounts: []

# Service monitor for Prometheus (optional)
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}
  annotations: {}