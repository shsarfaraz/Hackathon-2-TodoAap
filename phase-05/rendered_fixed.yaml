# Source: todo-chatbot/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-chatbot
  labels:
    helm.sh/chart: todo-chatbot-0.1.0
    app.kubernetes.io/name: todo-chatbot
    app.kubernetes.io/instance: todo-chatbot
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: todo-chatbot
      app.kubernetes.io/instance: todo-chatbot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: todo-chatbot
        app.kubernetes.io/instance: todo-chatbot
    spec:
      containers:
        - name: todo-chatbot
          image: "your-chatbot-image:latest"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 250m
              memory: 256Mi
