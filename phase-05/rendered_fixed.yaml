# Source: todo-chatbot/templates/audit-service/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-chatbot-audit-service
  labels:
    helm.sh/chart: todo-chatbot-0.1.0
    app.kubernetes.io/name: todo-chatbot
    app.kubernetes.io/instance: todo-chatbot
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    app: audit-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: todo-chatbot
      app.kubernetes.io/instance: todo-chatbot
      app: audit-service
  template:
    metadata:
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "audit-service"
        dapr.io/app-port: "50001"
        dapr.io/config: "tracing"
        dapr.io/protocol: "grpc"
      labels:
        app.kubernetes.io/name: todo-chatbot
        app.kubernetes.io/instance: todo-chatbot
        app: audit-service
    spec:
      containers:
        - name: audit-service
          image: "todo-chatbot/audit-service:latest"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50001
          env:
            - name: DATABASE_URL
              value: "postgresql://postgres:supersecurepassword@postgresql-postgresql.primary.svc.cluster.local:5432/postgres?sslmode=disable"
            - name: PYTHONPATH
              value: "/app/src"
          resources:
            limits:
              cpu: 300m
              memory: 256Mi
            requests:
              cpu: 150m
              memory: 128Mi
