# Default values for todo-chatbot

# Image configurations
replicaCount: 1
image:
  repository: your-chatbot-image
  tag: latest
  pullPolicy: IfNotPresent

# Service configurations
service:
  type: ClusterIP
  port: 80
  containerPort: 8080

# Resources configuration
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

# Node selection
nodeSelector: {}

tolerations: []

affinity: {}

# Service Account configuration
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# Ingress configuration
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# Database configuration
database:
  host: postgresql-postgresql.primary.svc.cluster.local
  port: 5432
  user: postgres
  password: supersecurepassword
  dbName: postgres
  sslMode: disable

# Dapr configuration
dapr:
  enabled: true
  appId: todo-chatbot
  appPort: 8000
  config: tracing
  protocol: grpc

# Chat API Service configuration
chatApi:
  replicaCount: 1
  image:
    repository: todo-chatbot/chat-api
    tag: latest
  service:
    port: 8000
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

# Recurring Task Service configuration
recurringTaskService:
  replicaCount: 1
  image:
    repository: todo-chatbot/recurring-task-service
    tag: latest
  service:
    port: 50001
  resources:
    limits:
      cpu: 300m
      memory: 256Mi
    requests:
      cpu: 150m
      memory: 128Mi

# Notification Service configuration
notificationService:
  replicaCount: 1
  image:
    repository: todo-chatbot/notification-service
    tag: latest
  service:
    port: 50001
  resources:
    limits:
      cpu: 300m
      memory: 256Mi
    requests:
      cpu: 150m
      memory: 128Mi

# Audit Service configuration
auditService:
  replicaCount: 1
  image:
    repository: todo-chatbot/audit-service
    tag: latest
  service:
    port: 50001
  resources:
    limits:
      cpu: 300m
      memory: 256Mi
    requests:
      cpu: 150m
      memory: 128Mi

# Frontend configuration
frontend:
  replicaCount: 1
  image:
    repository: todo-chatbot/frontend
    tag: latest
  service:
    port: 3000
  resources:
    limits:
      cpu: 300m
      memory: 256Mi
    requests:
      cpu: 150m
      memory: 128Mi

# Environment variables
env:
  DATABASE_URL: "postgresql://$(database.user):$(database.password)@$(database.host):$(database.port)/$(database.dbName)?sslmode=$(database.sslMode)"
  PYTHONPATH: "/app/src"